<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">RINAP Nursing and Paramedicals Logo</title>
  <desc id="desc">Round purple institute seal with nursing lamp, red cross and RINAP lettering.</desc>
  <defs>
    <path id="topArc" d="M 45 128 A 83 83 0 0 1 211 128" />
    <path id="bottomArc" d="M 211 128 A 83 83 0 0 1 45 128" />
    <linearGradient id="purple" x1="36" y1="36" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f246f" />
      <stop offset="1" stop-color="#1a1550" />
    </linearGradient>
    <linearGradient id="teal" x1="85" y1="92" x2="171" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a6b7c" />
      <stop offset="1" stop-color="#0f4c5c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#09172b" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="52" fill="none" />
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="106" fill="#fff" />
    <circle cx="128" cy="128" r="103" fill="none" stroke="url(#purple)" stroke-width="16" />
    <circle cx="128" cy="128" r="78" fill="#fff" stroke="#e5e1f1" stroke-width="2" />

    <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
      <text>
        <textPath href="#topArc" startOffset="50%" text-anchor="middle">SERVICE TO HUMANITY</textPath>
      </text>
      <text>
        <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SERVICE TO GOD</textPath>
      </text>
    </g>

    <g transform="translate(66 54)">
      <path d="M62 17c23 0 44 14 52 35" fill="none" stroke="url(#purple)" stroke-width="8" stroke-linecap="round" />
      <path d="M44 148c-21-9-36-30-36-55" fill="none" stroke="url(#purple)" stroke-width="8" stroke-linecap="round" />
      <path d="M22 96h15l9-20 15 45 14-31h28" fill="none" stroke="#1a6b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M62 42 33 68v58h58V68L62 42Z" fill="#f8fbfb" stroke="url(#teal)" stroke-width="5" stroke-linejoin="round" />
      <rect x="53" y="79" width="18" height="40" rx="3" fill="#231a5d" />
      <path d="M62 64v38M43 83h38" stroke="#d62b2b" stroke-width="9" stroke-linecap="round" />
      <path d="M99 57h18v15" fill="none" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" />
      <circle cx="20" cy="44" r="6" fill="#c9a227" />
    </g>

    <text x="154" y="209" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#22185b">RINAP</text>
  </g>
</svg>